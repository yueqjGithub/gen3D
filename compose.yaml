services:
  agent:
    build:
      context: .
      target: agent
    init: true
    restart: unless-stopped
    env_file:
      - .env.supabase
    environment:
      SUPABASE_CA_PATH: /app/deploy/supabase-ca.crt
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:62687/api/agents').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 40s

  server:
    build:
      context: .
      target: server
    init: true
    restart: unless-stopped
    environment:
      AGENT3D_WEB_ORIGIN: ${PUBLIC_ORIGIN:?请设置 Web 的完整公开地址}
      SUPABASE_CA_PATH: /app/deploy/supabase-ca.crt
    env_file:
      - .env.supabase
      - .env.server
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:62586/api/login',{headers:{Origin:'http://localhost:5173'}}).then(r=>process.exit(r.status===401||r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
      DEPLOY_USER: ${DEPLOY_USER:-owner}
      DEPLOY_PASSWORD_HASH: ${DEPLOY_PASSWORD_HASH:?请设置访问密码的 bcrypt 哈希}
    ports:
      - "${HTTP_BIND:-127.0.0.1}:80:80"
      - "${HTTP_BIND:-127.0.0.1}:443:443"
      - "${HTTP_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy

# 数据、附件、GLB、Trace 都保存到 Supabase，两个进程不共用业务数据卷。
# 审批/回答回调保留在 Server 内存，因此学习项目先只运行一个 Server 实例。
volumes:
  caddy-data:
  caddy-config:
