name: Node backend container
on:
  push:
    branches: [codex/deploy-node]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image without any production secrets
        uses: docker/build-push-action@v7
        with:
          context: .
          target: backend
          platforms: linux/amd64
          load: true
          tags: agent3d-backend:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check both independent Node processes
        shell: bash
        run: |
          # Mastra 启动会读取原生表。临时 PG 仅存在于本次 runner，绝不连接正式 Supabase。
          # 为临时 PG 生成专用证书，继续使用业务代码原本的严格 TLS 校验。
          mkdir -p "$RUNNER_TEMP/agent3d-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=db' -addext 'subjectAltName=DNS:db' \
            -keyout "$RUNNER_TEMP/agent3d-tls/server.key" \
            -out "$RUNNER_TEMP/agent3d-tls/server.crt"
          sudo chown 999:999 "$RUNNER_TEMP/agent3d-tls/server.key"
          sudo chmod 600 "$RUNNER_TEMP/agent3d-tls/server.key"
          docker network create agent3d-check
          docker run -d --name agent3d-db --network agent3d-check --network-alias db \
            -e POSTGRES_USER=check -e POSTGRES_PASSWORD=check \
            -v "$RUNNER_TEMP/agent3d-tls:/tls:ro" \
            postgres:17-bookworm -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key
          for attempt in $(seq 1 30); do
            if docker exec agent3d-db pg_isready -U check -d postgres; then break; fi
            sleep 2
          done
          docker run --rm --network agent3d-check --workdir /app/apps/server \
            -v "$RUNNER_TEMP/agent3d-tls/server.crt:/tmp/ci.crt:ro" \
            --entrypoint node agent3d-backend:check --input-type=module -e '
              import { PostgresStore } from "@mastra/pg";
              import { readFileSync } from "node:fs";
              const store = new PostgresStore({id:"container-ci",connectionString:"postgresql://check:check@db:5432/postgres",schemaName:"agent3d",ssl:{ca:readFileSync("/tmp/ci.crt","utf8"),rejectUnauthorized:true}});
              try { await store.init(); } finally { await store.close(); }
            '
          docker run -d --name agent3d-check --network agent3d-check -p 62586:62586 \
            -v "$RUNNER_TEMP/agent3d-tls/server.crt:/app/deploy/supabase-ca.crt:ro" \
            -e DATABASE_URL=postgresql://check:check@db:5432/postgres \
            -e SUPABASE_URL=https://example.invalid \
            -e SUPABASE_SECRET_KEY=check-only \
            -e SESSION_SECRET=check-only \
            agent3d-backend:check
          ready=false
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: http://localhost:5173' http://127.0.0.1:62586/api/login || true)
            if [ "$status" = 401 ] && docker exec agent3d-check node -e "fetch('http://127.0.0.1:62687/api/agents').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker logs agent3d-check; exit 1; fi
          docker image inspect agent3d-backend:check --format '{{.Size}} bytes'
          docker stop agent3d-check
          docker stop agent3d-db
          echo 'Node Server and independent Mastra Agent started successfully.' >> "$GITHUB_STEP_SUMMARY"
      - name: Build Web image for ECS
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          platforms: linux/amd64
          load: true
          tags: agent3d-web:deploy
          cache-from: type=gha
      - name: Export ready-to-run ECS images
        shell: bash
        run: |
          docker tag agent3d-backend:check agent3d-backend:deploy
          docker save agent3d-backend:deploy agent3d-web:deploy | gzip -1 > "$RUNNER_TEMP/agent3d-images.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum agent3d-images.tar.gz > agent3d-images.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: agent3d-ecs-images
          path: |
            ${{ runner.temp }}/agent3d-images.tar.gz
            ${{ runner.temp }}/agent3d-images.sha256
          retention-days: 3
          compression-level: 0
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs agent3d-check || true
          docker logs agent3d-db || true
